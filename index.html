  const GATE_DEFS = {
    AND: { type: 'AND', label: 'AND', symbol: '∧', inputs: 2, description: 'Output is 1 only when both inputs are 1' },

  function computeGate(type, inputs) {
    const a = inputs[0] ?? 0; const b = inputs[1] ?? 0;
    switch (type) {
      case 'AND': return a & b; case 'OR': return a | b; case 'NOT': return a ? 0 : 1;
      case 'NAND': return (a & b) ? 0 : 1; case 'NOR': return (a | b) ? 0 : 1;
      case 'XOR': return a ^ b; case 'XNOR': return a === b ? 1 : 0;
    }
  }

  function evaluateCircuit(circuit) {
    const nodeMap = new Map(circuit.nodes.map(n => [n.id, { ...n }]));
    const inDegree = new Map(); const adj = new Map();
    circuit.nodes.forEach(n => { inDegree.set(n.id, 0); adj.set(n.id, []); });
    circuit.wires.forEach(w => { inDegree.set(w.to, (inDegree.get(w.to) ?? 0) + 1); adj.get(w.from)?.push(w.to); });
    const queue = [];
    inDegree.forEach((deg, id) => { if (deg === 0) queue.push(id); });
    const processed = [];
    while (queue.length > 0) {
      const id = queue.shift(); processed.push(id);
      adj.get(id)?.forEach(next => { inDegree.set(next, (inDegree.get(next) ?? 1) - 1); if (inDegree.get(next) === 0) queue.push(next); });
    }
    processed.forEach(id => {
      const node = nodeMap.get(id); if (!node || node.type === 'input') return;
      const incomingWires = circuit.wires.filter(w => w.to === id);
      incomingWires.sort((a, b) => a.toPort - b.toPort);
      const inputValues = incomingWires.map(w => nodeMap.get(w.from)?.value ?? 0);
      if (node.gateType) node.value = computeGate(node.gateType, inputValues);
    });
    return Array.from(nodeMap.values());
  }

  function targetTruthTable(inputCount, fn) {
    const rows = [];
    for (let i = 0; i < (1 << inputCount); i++) {
      const inputValues = [];
      for (let j = inputCount - 1; j >= 0; j--) inputValues.push((i >> j) & 1);
      rows.push({ inputs: inputValues, outputs: [fn(inputValues)] });
    }
    return rows;
  }

  function useReveal() {
    const ref = useRef(null);
    useEffect(() => {
      const element = ref.current; if (!element) return;
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
      }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
      const observeReveals = () => { element.querySelectorAll('.reveal:not(.visible)').forEach(child => observer.observe(child)); };
      observeReveals();
      const mutationObserver = new MutationObserver(() => observeReveals());
      mutationObserver.observe(element, { childList: true, subtree: true });
      return () => { observer.disconnect(); mutationObserver.disconnect(); };
    }, []);
    return ref;
  }

  function useScrollProgress() {
    const [scrollProgress, setScrollProgress] = useState(0);
    useEffect(() => {
      const handleScroll = () => {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        setScrollProgress(docHeight > 0 ? (scrollTop / docHeight) * 100 : 0);
      };
      window.addEventListener('scroll', handleScroll, { passive: true }); handleScroll();
      return () => window.removeEventListener('scroll', handleScroll);
    }, []);
    return scrollProgress;
  }

      case 'NOT': return (<svg width={GATE_WIDTH} height={GATE_HEIGHT} viewBox="0 0 64 50"><path d="M 8 6 L 8 44 L 42 25 Z" fill={fill} stroke={stroke} strokeWidth={sw} strokeLinejoin="round" /><circle cx="46" cy="25" r="4" fill={fill} stroke={stroke} strokeWidth={sw} /></svg>);

      case 'NOR': return (<svg width={GATE_WIDTH} height={GATE_HEIGHT} viewBox="0 0 64 50"><path d="M 6 5 Q 18 25 6 45 Q 24 45 40 25 Q 24 5 6 5 Z" fill={fill} stroke={stroke} strokeWidth={sw} /><circle cx="46" cy="25" r="4" fill={fill} stroke={stroke} strokeWidth={sw} /></svg>);
      case 'XOR': return (<svg width={GATE_WIDTH} height={GATE_HEIGHT} viewBox="0 0 64 50"><path d="M 2 5 Q 14 25 2 45" fill="none" stroke={stroke} strokeWidth={sw} /><path d="M 8 5 Q 20 25 8 45 Q 26 45 44 25 Q 26 5 8 5 Z" fill={fill} stroke={stroke} strokeWidth={sw} /></svg>);
      case 'XNOR': return (<svg width={GATE_WIDTH} height={GATE_HEIGHT} viewBox="0 0 64 50"><path d="M 2 5 Q 14 25 2 45" fill="none" stroke={stroke} strokeWidth={sw} /><path d="M 8 5 Q 20 25 8 45 Q 24 45 40 25 Q 24 5 8 5 Z" fill={fill} stroke={stroke} strokeWidth={sw} /><circle cx="46" cy="25" r="4" fill={fill} stroke={stroke} strokeWidth={sw} /></svg>);
    }
  }
  function getGateInputPorts(type) {
    switch (type) {
      case 'NOT': return [{ x: 0, y: 25 }];
      case 'AND': case 'NAND': return [{ x: 0, y: 17 }, { x: 0, y: 33 }];
      case 'OR': case 'NOR': return [{ x: 2, y: 17 }, { x: 2, y: 33 }];
      case 'XOR': case 'XNOR': return [{ x: 4, y: 17 }, { x: 4, y: 33 }];
    }
  }
  function getGateOutputPort(type) {
    switch (type) {
      case 'NOT': return { x: 50, y: 25 }; case 'NAND': return { x: 52, y: 25 };
      case 'NOR': return { x: 50, y: 25 }; case 'XNOR': return { x: 50, y: 25 };
      case 'AND': return { x: 48, y: 25 }; case 'OR': return { x: 44, y: 25 };
      case 'XOR': return { x: 44, y: 25 };
    }
  }

  // ==================== CIRCUIT BUILDER ====================
  let idCounter = 0;
  const genId = () => `n${Date.now()}_${idCounter++}`;

  function CircuitBuilder({ inputLabels, allowedGates, maxGates, onCircuitChange, showTruthTable = true, compact = false }) {
    const canvasRef = useRef(null);
    const [nodes, setNodes] = useState([]);
    const [wires, setWires] = useState([]);
    const [draggingNode, setDraggingNode] = useState(null);
    const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
    const [wiring, setWiring] = useState(null);
    const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
    const [showGatePallete, setShowGatePallete] = useState(false);
    const gatesToShow = allowedGates ?? GATE_ORDER;

    useEffect(() => {
      const inputNodes = inputLabels.map((label, i) => ({ id: `input_${i}`, type: 'input', label, x: 40, y: 60 + i * 70, value: 0 }));
      setNodes(inputNodes); setWires([]);
    }, [inputLabels.length]);

    const evaluatedNodes = evaluateCircuit({ nodes, wires });
    const nodeMap = new Map(evaluatedNodes.map(n => [n.id, n]));

    useEffect(() => {
      const inputIds = nodes.filter(n => n.type === 'input').map(n => n.id);
      const outputIds = nodes.filter(n => n.type === 'gate' && !wires.some(w => w.from === n.id)).map(n => n.id);
      onCircuitChange?.({ nodes, wires }, inputIds, outputIds);
    }, [nodes, wires]);

    const addGate = (gateType) => {
      if (maxGates && nodes.filter(n => n.type === 'gate').length >= maxGates) return;
      const gateCount = nodes.filter(n => n.type === 'gate').length;
      setNodes(prev => [...prev, { id: genId(), type: 'gate', gateType, x: 240 + (gateCount % 4) * 110, y: 40 + Math.floor(gateCount / 4) * 90, value: 0 }]);
      setShowGatePallete(false);
    };
    const removeNode = (id) => { setNodes(prev => prev.filter(n => n.id !== id)); setWires(prev => prev.filter(w => w.from !== id && w.to !== id)); };
    const toggleInput = (id) => { setNodes(prev => prev.map(n => n.id === id ? { ...n, value: n.value ? 0 : 1 } : n)); };
    const removeWire = (id) => { setWires(prev => prev.filter(w => w.id !== id)); };

    useEffect(() => {
      if (!draggingNode) return;
      const handleGlobalMove = (e) => {
        const rect = canvasRef.current?.getBoundingClientRect(); if (!rect) return;
        const x = e.clientX - rect.left, y = e.clientY - rect.top;
        setNodes(prev => prev.map(n => n.id === draggingNode ? { ...n, x: Math.max(0, Math.min(rect.width - GATE_WIDTH, x - dragOffset.x)), y: Math.max(0, Math.min(rect.height - GATE_HEIGHT, y - dragOffset.y)) } : n));
      };
      const handleGlobalUp = () => setDraggingNode(null);
      window.addEventListener('mousemove', handleGlobalMove); window.addEventListener('mouseup', handleGlobalUp);
      return () => { window.removeEventListener('mousemove', handleGlobalMove); window.removeEventListener('mouseup', handleGlobalUp); };
    }, [draggingNode, dragOffset]);

    useEffect(() => {
      if (!wiring) return;
      const handleGlobalMove = (e) => { const rect = canvasRef.current?.getBoundingClientRect(); if (!rect) return; setMousePos({ x: e.clientX - rect.left, y: e.clientY - rect.top }); };
      const handleGlobalUp = () => setWiring(null);
      window.addEventListener('mousemove', handleGlobalMove); window.addEventListener('mouseup', handleGlobalUp);
      return () => { window.removeEventListener('mousemove', handleGlobalMove); window.removeEventListener('mouseup', handleGlobalUp); };
    }, [wiring]);

    const onNodeMouseDown = (e, id) => { e.stopPropagation(); const node = nodes.find(n => n.id === id); if (!node) return; const rect = canvasRef.current?.getBoundingClientRect(); if (!rect) return; setDragOffset({ x: e.clientX - rect.left - node.x, y: e.clientY - rect.top - node.y }); setDraggingNode(id); };
    const startWire = (e, fromId) => { e.stopPropagation(); setWiring(fromId); };
    const completeWire = (e, toId, toPort) => {
      e.stopPropagation();
      if (!wiring || wiring === toId) { setWiring(null); return; }
      const toNode = nodes.find(n => n.id === toId); if (!toNode || toNode.type !== 'gate') { setWiring(null); return; }
      const def = toNode.gateType ? GATE_DEFS[toNode.gateType] : null; if (!def) { setWiring(null); return; }
      if (toPort >= def.inputs) { setWiring(null); return; }
      setWires(prev => [...prev.filter(w => !(w.to === toId && w.toPort === toPort)), { id: genId(), from: wiring, to: toId, toPort }]);
      setWiring(null);
    };
    const clearAll = () => { const inputNodes = inputLabels.map((label, i) => ({ id: `input_${i}`, type: 'input', label, x: 40, y: 60 + i * 70, value: 0 })); setNodes(inputNodes); setWires([]); };

    const getOutputPos = (node) => { if (node.type === 'input') return { x: node.x + 60, y: node.y + 20 }; const port = getGateOutputPort(node.gateType); return { x: node.x + port.x, y: node.y + port.y }; };
    const getInputPos = (node, port) => { if (node.type === 'input') return { x: node.x, y: node.y + 20 }; const ports = getGateInputPorts(node.gateType); return { x: node.x + ports[port].x, y: node.y + ports[port].y }; };

    const buildWirePath = (from, to) => {
      const goingRight = to.x >= from.x; const dx = Math.abs(to.x - from.x); const dy = to.y - from.y;
      if (goingRight) { const midX = from.x + dx / 2; return `M ${from.x} ${from.y} C ${midX} ${from.y}, ${midX} ${to.y}, ${to.x} ${to.y}`; }
      else { const offset = 30; const dir = dy >= 0 ? 1 : -1; const routingY = (from.y + to.y) / 2 + dir * offset; return `M ${from.x} ${from.y} L ${from.x + 20} ${from.y} Q ${from.x + 30} ${from.y}, ${from.x + 30} ${from.y + 15 * dir} L ${from.x + 30} ${routingY} Q ${from.x + 30} ${routingY + 15 * -dir}, ${from.x + 15} ${routingY + 15 * -dir} L ${to.x + 15} ${routingY + 15 * -dir} Q ${to.x} ${routingY + 15 * -dir}, ${to.x} ${routingY + 15 * dir} L ${to.x} ${to.y}`; }
    };

    const outputNodes = nodes.filter(n => n.type === 'gate' && !wires.some(w => w.from === n.id));
    const gateCount = nodes.filter(n => n.type === 'gate').length;

    return (
      <div className="space-y-3">
        <div className="flex flex-wrap items-center gap-2">
          <button onClick={() => setShowGatePallete(!showGatePallete)} disabled={maxGates ? gateCount >= maxGates : false} className="flex items-center gap-2 px-4 py-2 rounded-lg bg-teal-600/20 border border-teal-500/30 text-teal-300 hover:bg-teal-600/30 transition-all text-sm font-medium disabled:opacity-40 disabled:cursor-not-allowed"><Plus size={16} />Add Gate</button>
          <button onClick={clearAll} className="flex items-center gap-2 px-4 py-2 rounded-lg glass-card text-neutral-300 hover:text-red-400 transition-all text-sm font-medium"><Trash2 size={16} />Clear</button>
          {maxGates && <span className="text-xs text-neutral-500 ml-auto">Gates: {gateCount}/{maxGates}</span>}
        </div>
        {showGatePallete && (
          <div className="glass-card rounded-xl p-3 flex flex-wrap gap-2 animate-fade-in">
            {gatesToShow.map(gt => { const def = GATE_DEFS[gt]; return (
              <button key={gt} onClick={() => addGate(gt)} className="flex items-center gap-2 px-3 py-2 rounded-lg bg-neutral-800/60 hover:bg-teal-600/20 border border-white/5 hover:border-teal-500/30 transition-all">
                <div className="scale-75 origin-center"><GateShape type={gt} value={0} /></div>
                <div className="text-left"><div className="text-xs font-semibold text-white">{def.label}</div><div className="text-[10px] text-neutral-500">{def.inputs} inp</div></div>
              </button> ); })}
          </div>
        )}
        <div ref={canvasRef} className="relative bg-neutral-900/60 rounded-xl border border-white/5 overflow-hidden" style={{ height: compact ? 300 : 420 }}>
          <div className="absolute inset-0 opacity-20" style={{ backgroundImage: 'radial-gradient(circle, rgba(148,163,184,0.15) 1px, transparent 1px)', backgroundSize: '20px 20px' }} />
          <svg className="absolute inset-0 w-full h-full pointer-events-none" style={{ zIndex: 1 }}>
            {wires.map(wire => { const from = nodeMap.get(wire.from); const to = nodeMap.get(wire.to); if (!from || !to) return null; const fromPos = getOutputPos(from); const toPos = getInputPos(to, wire.toPort); return (
              <g key={wire.id} className="pointer-events-auto cursor-pointer" onClick={e => { e.stopPropagation(); removeWire(wire.id); }}>
                <path d={buildWirePath(fromPos, toPos)} fill="none" stroke={from.value ? '#2dd4bf' : '#64748b'} strokeWidth="2.5" className="hover:stroke-red-500 transition-colors" />
                <circle cx={toPos.x} cy={toPos.y} r="4" fill={from.value ? '#2dd4bf' : '#64748b'} /><circle cx={fromPos.x} cy={fromPos.y} r="3" fill={from.value ? '#2dd4bf' : '#64748b'} />
              </g> ); })}
            {wiring && (() => { const from = nodeMap.get(wiring); if (!from) return null; const fromPos = getOutputPos(from); return <path d={buildWirePath(fromPos, mousePos)} fill="none" stroke="#2dd4bf" strokeWidth="2" strokeDasharray="5,3" opacity="0.6" />; })()}
          </svg>
          {evaluatedNodes.map(node => {
            const isInput = node.type === 'input'; const isOutput = node.type === 'gate' && !wires.some(w => w.from === node.id);
            const gateDef = node.gateType ? GATE_DEFS[node.gateType] : null;
            const inputPorts = node.gateType ? getGateInputPorts(node.gateType) : [];
            const outputPort = node.gateType ? getGateOutputPort(node.gateType) : null;
            return (
              <div key={node.id} className="absolute select-none" style={{ left: node.x, top: node.y, zIndex: 2, cursor: 'grab' }} onMouseDown={e => { const target = e.target; if (target.closest && (target.closest('.port-dot') || target.closest('button'))) return; onNodeMouseDown(e, node.id); }}>
                {isInput ? (
                  <div className="relative w-[60px]">
                    <button onClick={() => toggleInput(node.id)} onMouseDown={e => e.stopPropagation()} className="w-full glass-card rounded-lg p-2 text-center hover:border-blue-500/50 transition-all"><div className="text-xs text-blue-400 font-medium">{node.label}</div><div className={`text-lg font-bold ${node.value ? 'text-teal-400' : 'text-neutral-500'}`}>{node.value}</div></button>
                    <div className="port-dot absolute -right-2 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full border-2 border-neutral-500 bg-neutral-900 hover:border-teal-400 cursor-crosshair transition-colors" onMouseDown={e => startWire(e, node.id)} title="Output — drag to connect" />
                  </div>
                ) : (
                  <div className="relative" style={{ width: GATE_WIDTH, height: GATE_HEIGHT }}>
                    <GateShape type={node.gateType} value={node.value} />
                    {inputPorts.map((port, portIdx) => <div key={portIdx} className="port-dot absolute w-3.5 h-3.5 rounded-full border-2 border-neutral-500 bg-neutral-900 hover:border-teal-400 cursor-crosshair transition-colors" style={{ left: port.x - 7, top: port.y - 7 }} onMouseUp={e => completeWire(e, node.id, portIdx)} title={`Input ${portIdx + 1}`} />)}
                    {outputPort && <div className="port-dot absolute w-3.5 h-3.5 rounded-full border-2 border-neutral-500 bg-neutral-900 hover:border-teal-400 cursor-crosshair transition-colors" style={{ left: outputPort.x - 7, top: outputPort.y - 7 }} onMouseDown={e => startWire(e, node.id)} title="Output — drag to connect" />}
                    <div className={`absolute -top-2 -right-1 w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${node.value ? 'bg-teal-500 text-neutral-950' : 'bg-neutral-700 text-neutral-400'}`}>{node.value}</div>
                    <div className="absolute -bottom-4 left-1/2 -translate-x-1/2 text-[9px] text-neutral-500 font-medium whitespace-nowrap">{gateDef?.label}</div>
                    {isOutput && <div className="absolute -bottom-4 right-0 text-[10px] text-amber-400 font-medium whitespace-nowrap">= {node.value}</div>}
                    <button onClick={e => { e.stopPropagation(); removeNode(node.id); }} onMouseDown={e => e.stopPropagation()} className="absolute -top-2 -left-2 w-5 h-5 rounded-full bg-red-600/80 hover:bg-red-500 flex items-center justify-center transition-colors z-10"><X size={12} className="text-white" /></button>
                  </div>
                )}
              </div> );
          })}
          {nodes.filter(n => n.type === 'gate').length === 0 && (
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none"><div className="text-center text-neutral-600"><CircuitBoard size={48} className="mx-auto mb-2 opacity-40" /><p className="text-sm">Click "Add Gate" to start building</p><p className="text-xs mt-1">Drag from output dots to input dots to wire gates</p></div></div>
          )}
        </div>
        {outputNodes.length > 0 && (
          <div className="flex flex-wrap items-center gap-3 text-sm"><span className="text-neutral-400 font-medium">Output:</span>{outputNodes.map(n => <span key={n.id} className="flex items-center gap-1.5 px-3 py-1 rounded-lg glass-card"><Zap size={14} className={n.value ? 'text-teal-400' : 'text-neutral-600'} /><span className={n.value ? 'text-teal-400 font-bold' : 'text-neutral-500'}>{n.value}</span></span>)}</div>
        )}
        {showTruthTable && outputNodes.length > 0 && (<TruthTable nodes={evaluatedNodes} wires={wires} inputIds={nodes.filter(n => n.type === 'input').map(n => n.id)} outputIds={outputNodes.map(n => n.id)} inputLabels={inputLabels} />)}
      </div>
    );
  }

  function TruthTable({ nodes, wires, inputIds, outputIds, inputLabels }) {
    const [rows, setRows] = useState([]);
    useEffect(() => {
      const n = inputIds.length; const newRows = [];
      for (let i = 0; i < (1 << n); i++) {
        const inputValues = [];
        for (let j = n - 1; j >= 0; j--) inputValues.push((i >> j) & 1);
        const testNodes = nodes.map(node => { if (node.type === 'input') { const idx = inputIds.indexOf(node.id); if (idx >= 0) return { ...node, value: inputValues[idx] }; } return { ...node, value: 0 }; });
        const evaluated = evaluateCircuit({ nodes: testNodes, wires });
        const outputValues = outputIds.map(oid => evaluated.find(nn => nn.id === oid)?.value ?? 0);
        newRows.push({ inputs: inputValues, outputs: outputValues });
      }
      setRows(newRows);
    }, [nodes, wires, inputIds, outputIds]);
    return (
      <div className="glass-card rounded-xl p-4 overflow-x-auto">
        <div className="text-xs font-semibold text-neutral-400 uppercase tracking-wider mb-2">Truth Table</div>
        <table className="w-full text-sm"><thead><tr className="border-b border-white/10">{inputLabels.map(label => <th key={label} className="px-3 py-1.5 text-blue-400 font-semibold text-center">{label}</th>)}<th className="px-2 text-neutral-600">|</th>{outputIds.map((_, i) => <th key={i} className="px-3 py-1.5 text-amber-400 font-semibold text-center">Y{i + 1}</th>)}</tr></thead>
          <tbody>{rows.map((row, i) => <tr key={i} className="border-b border-white/5 hover:bg-white/5 transition-colors">{row.inputs.map((v, j) => <td key={j} className={`px-3 py-1.5 text-center font-mono ${v ? 'text-teal-400' : 'text-neutral-500'}`}>{v}</td>)}<td className="px-2 text-neutral-700">|</td>{row.outputs.map((v, j) => <td key={j} className={`px-3 py-1.5 text-center font-mono font-bold ${v ? 'text-amber-400' : 'text-neutral-600'}`}>{v}</td>)}</tr>)}</tbody>
        </table>
      </div>
    );
  }

  // ==================== FULL ADDER BUILDER ====================
  const NUM_BITS = 7, MIN_FAS = 4, FA_NODE_W = 112, FA_NODE_H = 76, CANVAS_W = 860, CANVAS_H = 400, BIT_AREA_W = 70, BIT_SPACING = 42, BIT_START_Y = 36;
  const inputPortY = { a: 18, b: 38, cin: 58 }, outputPortY = { sum: 25, cout: 51 };

  function topoSortFAs(nodeIds, faInputs) {
    const visited = new Set(), inProgress = new Set(), result = [];
    const visit = id => { if (visited.has(id)) return true; if (inProgress.has(id)) return false; inProgress.add(id); const inputs = faInputs.get(id); if (inputs) { for (const src of [inputs.a, inputs.b, inputs.cin]) { if (src && src.type === 'fa' && !visit(src.nodeId)) return false; } } inProgress.delete(id); visited.add(id); result.push(id); return true; };
    for (const id of nodeIds) { if (!visit(id)) return null; }
    return result;
  }
  function permuteIndices(n) {
    if (n <= 1) return [[0]]; const arr = Array.from({ length: n }, (_, i) => i); const result = [];
    const generate = k => { if (k === 1) { result.push([...arr]); return; } for (let i = 0; i < k; i++) { generate(k - 1); const tmp = arr[i]; arr[i] = arr[k - 1]; arr[k - 1] = tmp; } };
    generate(n); return result;
  }

  function FullAdderBuilder() {
    const canvasRef = useRef(null); const nextNodeId = useRef(1); const nextWireId = useRef(1);
    const [nodes, setNodes] = useState([]); const [wires, setWires] = useState([]);
    const [draggingNode, setDraggingNode] = useState(null); const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
    const [wiring, setWiring] = useState(null); const [pointer, setPointer] = useState({ x: 0, y: 0 });
    const [checkResult, setCheckResult] = useState(null);

    useEffect(() => {
      if (draggingNode === null && wiring === null) return;
      const move = event => { const rect = canvasRef.current?.getBoundingClientRect(); if (!rect) return; const x = event.clientX - rect.left, y = event.clientY - rect.top; setPointer({ x, y }); if (draggingNode !== null) { setNodes(current => current.map(node => node.id === draggingNode ? { ...node, x: Math.max(BIT_AREA_W + 14, Math.min(CANVAS_W - FA_NODE_W - 8, x - dragOffset.x)), y: Math.max(28, Math.min(CANVAS_H - FA_NODE_H - 8, y - dragOffset.y)) } : node)); } };
      const end = () => { setDraggingNode(null); setWiring(null); };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', end);
      return () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', end); };
    }, [draggingNode, wiring, dragOffset]);

    const addFullAdder = () => { if (nodes.length >= NUM_BITS) return; const index = nodes.length; const id = nextNodeId.current++; setNodes(current => [...current, { id, x: BIT_AREA_W + 22 + (index % 4) * 138, y: 40 + Math.floor(index / 4) * 120 }]); };
    const deleteNode = nodeId => { setNodes(current => current.filter(n => n.id !== nodeId)); setWires(current => current.filter(w => !(w.from.type === 'fa' && w.from.nodeId === nodeId) && w.toId !== nodeId)); setCheckResult(null); };
    const clear = () => { setNodes([]); setWires([]); setCheckResult(null); };
    const startDragging = (event, node) => { const target = event.target; if (target.closest && (target.closest('.fa-port') || target.closest('.fa-delete'))) return; const rect = canvasRef.current?.getBoundingClientRect(); if (!rect) return; setDragOffset({ x: event.clientX - rect.left - node.x, y: event.clientY - rect.top - node.y }); setDraggingNode(node.id); event.preventDefault(); };
    const startWire = (event, source) => { event.stopPropagation(); const rect = canvasRef.current?.getBoundingClientRect(); if (rect) setPointer({ x: event.clientX - rect.left, y: event.clientY - rect.top }); setWiring(source); event.preventDefault(); };
    const completeWire = (event, toId, toPort) => { event.stopPropagation(); if (!wiring) return; if (wiring.type === 'fa' && wiring.nodeId === toId) return; setWires(current => [...current.filter(wire => !(wire.toId === toId && wire.toPort === toPort)), { id: nextWireId.current++, from: wiring, toId, toPort }]); setWiring(null); };
    const removeWire = wireId => setWires(current => current.filter(wire => wire.id !== wireId));

    const nodeById = id => nodes.find(node => node.id === id);
    const outputPosition = (node, port) => ({ x: node.x + FA_NODE_W, y: node.y + outputPortY[port] });
    const inputPosition = (node, port) => ({ x: node.x, y: node.y + inputPortY[port] });
    const bitPortPosition = bitIndex => ({ x: BIT_AREA_W, y: BIT_START_Y + bitIndex * BIT_SPACING });
    const sourcePosition = source => { if (source.type === 'fa') { const node = nodeById(source.nodeId); if (!node) return { x: 0, y: 0 }; return outputPosition(node, source.port); } return bitPortPosition(source.bitIndex); };
    const wirePath = (from, to) => { const midX = Math.max(from.x + 24, (from.x + to.x) / 2); return `M ${from.x} ${from.y} C ${midX} ${from.y}, ${midX} ${to.y}, ${to.x} ${to.y}`; };

    const checkSolution = () => {
      if (nodes.length < MIN_FAS) { setCheckResult({ correct: false, message: `You need at least ${MIN_FAS} Full Adders for a 7-bit population counter. You currently have ${nodes.length}.` }); return; }
      const connectedBits = new Set(); for (const wire of wires) { if (wire.from.type === 'bit') connectedBits.add(wire.from.bitIndex); }
      for (let i = 0; i < NUM_BITS; i++) { if (!connectedBits.has(i)) { setCheckResult({ correct: false, message: `Bit ${i} is not connected. All 7 bits (0–6) must be used.` }); return; } }
      const faInputs = new Map();
      for (const node of nodes) { const aWire = wires.find(w => w.toId === node.id && w.toPort === 'a'); const bWire = wires.find(w => w.toId === node.id && w.toPort === 'b'); const cinWire = wires.find(w => w.toId === node.id && w.toPort === 'cin'); faInputs.set(node.id, { a: aWire ? aWire.from : null, b: bWire ? bWire.from : null, cin: cinWire ? cinWire.from : null }); }
      const sorted = topoSortFAs(nodes.map(n => n.id), faInputs);

      const freeOutputs = [];

      if (freeOutputs.length < 3) { setCheckResult({ correct: false, message: `Your circuit has only ${freeOutputs.length} unconnected output(s). A 7-bit counter needs at least 3 output bits (to represent 0–7).` }); return; }
      if (freeOutputs.length > 6) { setCheckResult({ correct: false, message: 'Too many unconnected outputs. Connect more Full Adders together to form a tree.' }); return; }

  function toNum(value) { if (!value) return 0; const parsed = Number(value); return Number.isFinite(parsed) ? parsed : 0; }

  function parseGamelog(data) {
    if (!data || typeof data !== 'object') return null;
    const root = data;
    const labels = Array.isArray(root.labels) ? root.labels : Array.from(STATS_LABELS);
    const eventsMap = root.events;
    const seasonTypes = Array.isArray(root.seasonTypes) ? root.seasonTypes : [];
    const regularSeason = seasonTypes.find(st => /regular season/i.test(String(st.displayName ?? '')));
    if (!regularSeason) return null;
    const categories = Array.isArray(regularSeason.categories) ? regularSeason.categories : [];
    const games = [];
    for (const category of categories) {
      const catGames = Array.isArray(category.events) ? category.events : [];
      for (const gameEntry of catGames) {
        const eventId = String(gameEntry.eventId ?? '');
        const rawStats = Array.isArray(gameEntry.stats) ? gameEntry.stats : [];
        const statsByLabel = {};
        labels.forEach((label, i) => { statsByLabel[label] = rawStats[i] ?? ''; });
        const meta = eventsMap?.[eventId];
        const gameDate = meta ? String(meta.gameDate ?? '') : '';
        const opponentObj = meta?.opponent;
        const opponent = opponentObj ? String(opponentObj.displayName ?? '—') : '—';
        const result = String(meta?.gameResult ?? '') === 'L' ? 'L' : 'W';
        const score = String(meta?.score ?? '—');
        games.push({ date: gameDate, opponent, result, score, points: toNum(statsByLabel['PTS']), rebounds: toNum(statsByLabel['REB']), assists: toNum(statsByLabel['AST']), blocks: toNum(statsByLabel['BLK']), steals: toNum(statsByLabel['STL']), minutes: toNum(statsByLabel['MIN']), fgPct: toNum(statsByLabel['FG%']), fg3Pct: toNum(statsByLabel['3P%']), ftPct: toNum(statsByLabel['FT%']), turnovers: toNum(statsByLabel['TO']) });
      }
    }
    games.sort((a, b) => a.date.localeCompare(b.date));
    if (games.length === 0) return null;
    const n = games.length;
    const avg = selector => games.reduce((sum, g) => sum + selector(g), 0) / n;
    const filters = Array.isArray(root.filters) ? root.filters : [];
    const seasonFilter = filters.find(f => f.name === 'season');
    const seasonValue = seasonFilter ? String(seasonFilter.value ?? '') : '';
    const seasonLabel = (() => { if (!seasonFilter) return ''; const options = Array.isArray(seasonFilter.options) ? seasonFilter.options : []; const match = options.find(o => String(o.value ?? '') === seasonValue); return match ? String(match.displayValue ?? '') : ''; })();
    return { seasonLabel, gamesPlayed: n, ppg: avg(g => g.points), rpg: avg(g => g.rebounds), apg: avg(g => g.assists), fgPct: avg(g => g.fgPct), fg3Pct: avg(g => g.fg3Pct), ftPct: avg(g => g.ftPct), spg: avg(g => g.steals), bpg: avg(g => g.blocks), topg: avg(g => g.turnovers), mpg: avg(g => g.minutes), mostRecentGame: games[games.length - 1] };

            <div className="glass-card rounded-2xl p-5 sm:p-6 mb-6"><div className="flex flex-col sm:flex-row sm:items-start justify-between gap-4"><div className="flex-1"><div className="flex items-center gap-3 mb-2"><div className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium ${selectedChallenge.difficulty === 'Easy' ? 'bg-green-500/15 text-green-400' : selectedChallenge.difficulty === 'Medium' ? 'bg-amber-500/15 text-amber-400' : 'bg-red-500/15 text-red-400'}`}>{selectedChallenge.difficulty}</div>{solved.has(selectedChallenge.id) && <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-teal-500/15 text-teal-400"><Trophy size={12} /> Solved</span>}</div><h3 className="text-xl font-bold text-white mb-2">{selectedChallenge.title}</h3><p className="text-sm text-neutral-300">{selectedChallenge.description}</p></div><button onClick={() => { setSelectedChallenge(null); setResult(null); }} className="flex items-center gap-2 px-4 py-2 rounded-lg glass-card text-neutral-300 hover:text-white text-sm font-medium transition-all flex-shrink-0"><RotateCcw size={16} />Back to challenges</button></div><div className="flex flex-wrap items-center gap-4 mt-4 pt-4 border-t border-white/5 text-xs text-neutral-500"><span>Inputs: <span className="text-blue-400 font-mono">{selectedChallenge.inputLabels.join(', ')}</span></span><span>Output: <span className="text-amber-400 font-mono">{selectedChallenge.outputLabel}</span></span><span>Max gates: <span className="text-white font-mono">{selectedChallenge.maxGates}</span></span><span>Allowed: <span className="text-teal-400 font-mono">{selectedChallenge.allowedGates.length === 1 ? selectedChallenge.allowedGates[0] + ' only' : 'All gates'}</span></span></div></div>
            <CircuitBuilder inputLabels={selectedChallenge.inputLabels} allowedGates={selectedChallenge.allowedGates} maxGates={selectedChallenge.maxGates} onCircuitChange={handleCircuitChange} showTruthTable={true} compact />
            <div className="flex flex-wrap items-center gap-3 mt-6"><button onClick={checkSolution} className="flex items-center gap-2 px-6 py-3 rounded-xl bg-gradient-to-r from-teal-600 to-cyan-600 text-white font-semibold shadow-lg shadow-teal-600/20 hover:shadow-teal-600/40 hover:scale-105 transition-all"><ClipboardCheck size={18} />Check Solution</button><button onClick={() => setShowHint(!showHint)} className="flex items-center gap-2 px-5 py-3 rounded-xl glass-card glass-card-hover text-neutral-300 hover:text-amber-400 text-sm font-medium transition-all"><Lightbulb size={18} />{showHint ? 'Hide Hint' : 'Show Hint'}</button></div>
            {showHint && <div className="glass-card rounded-xl p-4 mt-4 border-l-4 border-amber-500/50 animate-fade-in"><div className="flex items-start gap-3"><Lightbulb size={18} className="text-amber-400 flex-shrink-0 mt-0.5" /><p className="text-sm text-neutral-300">{selectedChallenge.hint}</p></div></div>}
            {result === 'correct' && <div className="glass-card rounded-xl p-6 mt-4 border-l-4 border-teal-500 animate-fade-in"><div className="flex items-center gap-3"><CheckCircle2 size={28} className="text-teal-400" /><div><h4 className="text-lg font-bold text-teal-400">Correct! Circuit verified.</h4><p className="text-sm text-neutral-400 mt-1">Your circuit matches the target truth table. Try another challenge!</p></div></div></div>}
            {result === 'wrong' && <div className="glass-card rounded-xl p-6 mt-4 border-l-4 border-red-500 animate-fade-in"><div className="flex items-center gap-3"><XCircle size={28} className="text-red-400" /><div><h4 className="text-lg font-bold text-red-400">Not quite right.</h4><p className="text-sm text-neutral-400 mt-1">{circuitData?.outputIds.length === 0 ? 'You need at least one output gate (a gate with no wires going out from it).' : 'Compare your truth table with the expected output. Check the hint if you\'re stuck!'}</p></div></div></div>}
            <div className="glass-card rounded-xl p-4 mt-6"><div className="text-xs font-semibold text-neutral-400 uppercase tracking-wider mb-2">Target Output</div><table className="text-sm"><thead><tr className="border-b border-white/10">{selectedChallenge.inputLabels.map(label => <th key={label} className="px-3 py-1.5 text-blue-400 font-semibold text-center">{label}</th>)}<th className="px-2 text-neutral-600">|</th><th className="px-3 py-1.5 text-amber-400 font-semibold text-center">{selectedChallenge.outputLabel}</th></tr></thead><tbody>{targetTruthTable(selectedChallenge.inputLabels.length, selectedChallenge.targetFn).map((row, i) => <tr key={i} className="border-b border-white/5">{row.inputs.map((v, j) => <td key={j} className={`px-3 py-1.5 text-center font-mono ${v ? 'text-teal-400' : 'text-neutral-500'}`}>{v}</td>)}<td className="px-2 text-neutral-700">|</td><td className={`px-3 py-1.5 text-center font-mono font-bold ${row.outputs[0] ? 'text-amber-400' : 'text-neutral-600'}`}>{row.outputs[0]}</td></tr>)}</tbody></table></div>
          </div>
        )}
      </div>
    );
  }
  function LogicLab() {
    const ref = useReveal(); const [tab, setTab] = useState('playground');
    return (
      <section id="logiclab" ref={ref} className="relative py-24 sm:py-32 px-4 sm:px-6 lg:px-8 overflow-hidden">
        <div className="absolute top-1/4 right-0 w-96 h-96 bg-teal-600/5 rounded-full blur-3xl" /><div className="absolute bottom-1/4 left-0 w-72 h-72 bg-cyan-500/5 rounded-full blur-3xl" />
        <div className="relative max-w-7xl mx-auto">
          <div className="reveal text-center mb-12"><div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-teal-600/10 border border-teal-600/30 mb-4"><span className="w-2 h-2 bg-teal-500 rounded-full animate-pulse" /><span className="text-sm font-medium text-teal-400">Interactive Logic Design</span></div><h2 className="text-4xl sm:text-5xl md:text-6xl font-bold text-white mb-4">Logic Gate <span className="text-teal-400">Lab</span></h2><p className="text-neutral-400 max-w-2xl mx-auto">Build circuits with logic gates, toggle inputs, and see outputs in real time. Then test your skills in the challenge zone — all running live in your browser.</p><div className="w-20 h-1 bg-gradient-to-r from-teal-600 to-cyan-400 mx-auto rounded-full mt-4" /></div>
          <div className="reveal flex justify-center mb-8"><div className="inline-flex rounded-xl glass-card p-1.5 gap-1"><TabButton active={tab === 'playground'} onClick={() => setTab('playground')} icon={<Gamepad2 size={18} />} label="Playground" /><TabButton active={tab === 'testzone'} onClick={() => setTab('testzone')} icon={<ClipboardCheck size={18} />} label="Test Zone" /></div></div>
          {tab === 'playground' ? <Playground /> : <TestZone />}
        </div>
      </section>
    );
  }

  // ==================== APP ====================
  function App() {
    return (
      <div className="relative min-h-screen bg-neutral-950 text-neutral-100 overflow-x-hidden">
        <div className="noise-overlay" />
        <Navbar />
        <main className="relative z-10">
          <Hero />
          <About />
          <LogicLab />
          <NBAHighlights />
          <Gallery />
          <Contact />
        </main>
      </div>
    );
  }

  const root = createRoot(document.getElementById('root'));
  root.render(<App />);
  </script>
</body>
</html>
